<section class="login-page">
  <div class="contenido">
    <span class="logo">⚽ CanchaFácil</span>
    <h1>Tu cancha, tu momento.</h1>
    <p>Bienvenido de nuevo. Accede a tu cuenta.</p>
  </div>

  <app-login-form
    [titulo]="'Ingreso al sistema'"
    [enviando]="enviando()"
    (loginEnviado)="procesarLogin($event)"
  ></app-login-form>

  @if (enviando()) {
    <p class="aviso" role="status">Iniciando sesión...</p>
  }

  @if (mensaje()) {
    <p class="aviso" role="alert">{{ mensaje() }}</p>
  }
</section>
