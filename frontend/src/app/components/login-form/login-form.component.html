<div class="auth-tarjeta">
  <h2>{{ titulo() }}</h2>

  <form #formulario="ngForm" (ngSubmit)="enviarLogin()">
    <div class="campo-form">
      <label for="email">Correo electrónico</label>
      <input
        class="control"
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        placeholder="tu@correo.com"
        autocomplete="username"
        required
      />
    </div>

    <div class="campo-form">
      <label for="password">Contraseña</label>
      <input
        class="control"
        type="password"
        id="password"
        [(ngModel)]="password"
        name="password"
        placeholder="••••••••••••"
        autocomplete="current-password"
        required
      />
    </div>

    <button class="btn btn-primario" type="submit" [disabled]="enviando() || formulario.invalid">
      {{ enviando() ? 'Ingresando...' : 'Iniciar sesión' }}
    </button>
  </form>
</div>
