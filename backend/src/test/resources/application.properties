# Configuracion solo para los tests: base de datos H2 en memoria, para que
# "mvn test" no necesite un PostgreSQL levantado. PostgreSQLDialect no aplica
# aqui; H2 se ejecuta en modo compatibilidad con PostgreSQL.
spring.datasource.url=jdbc:h2:mem:canchafacil;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Misma politica que en produccion: la sesion sigue abierta al renderizar la vista.
spring.jpa.open-in-view=true

# ---------------------------------------------------------------------------
# Validacion
# ---------------------------------------------------------------------------
# Las validaciones (@NotBlank, @Email, @Size...) se ejecutan en los controladores
# con @Valid y los errores se muestran en el formulario. Se desactiva la
# re-validacion automatica de Hibernate al guardar para que datos antiguos que
# no cumplan las reglas nuevas no impidan, por ejemplo, cambiar un estado.
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Mensajes propios (typeMismatch, etc.) en src/main/resources/messages.properties
spring.messages.basename=messages
spring.messages.encoding=UTF-8
