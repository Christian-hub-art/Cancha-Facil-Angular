spring.application.name=CanchaFacil

# Puerto en el que arranca la aplicacion
server.port=8080

# En desarrollo desactivamos la cache para ver los cambios del HTML al guardar
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------------
# Conexion a PostgreSQL
# ---------------------------------------------------------------------------
# Los valores se leen de variables de entorno y, si no existen, se usa el
# valor por defecto despues de los dos puntos. Asi la contrasena real no queda
# escrita en el repositorio.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:canchafacil}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# update = Hibernate crea y ajusta las tablas segun las entidades. Comodo para
# desarrollo. En produccion se pone "validate" y los cambios de esquema se
# manejan con migraciones (Flyway o Liquibase).
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que Hibernate ejecuta, ya formateado.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mantiene abierta la sesion de JPA mientras Thymeleaf renderiza la vista, para
# que las relaciones LAZY se puedan leer desde las plantillas sin error.
spring.jpa.open-in-view=true

# ---------------------------------------------------------------------------
# Validacion
# ---------------------------------------------------------------------------
# Las validaciones (@NotBlank, @Email, @Size...) se ejecutan en los controladores
# con @Valid y los errores se muestran en el formulario. Se desactiva la
# re-validacion automatica de Hibernate al guardar para que datos antiguos que
# no cumplan las reglas nuevas no impidan, por ejemplo, cambiar un estado.
spring.jpa.properties.jakarta.persistence.validation.mode=none

# Mensajes propios (typeMismatch, etc.) en src/main/resources/messages.properties
spring.messages.basename=messages
spring.messages.encoding=UTF-8
