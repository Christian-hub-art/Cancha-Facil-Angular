# Mensajes que Spring usa cuando un valor del formulario no se puede convertir
# al tipo del campo (por ejemplo letras en un campo numerico o una fecha invalida).
typeMismatch=El valor ingresado no tiene un formato valido
typeMismatch.java.lang.Integer=Debe ingresar un numero entero
typeMismatch.java.lang.Long=Debe ingresar un numero entero
typeMismatch.java.math.BigDecimal=Debe ingresar un valor numerico
typeMismatch.java.time.LocalDate=Debe ingresar una fecha valida (aaaa-mm-dd)
typeMismatch.java.time.LocalTime=Debe ingresar una hora valida (hh:mm)
typeMismatch.com.example.demo.Entidades.Rol=Debe seleccionar un rol valido
